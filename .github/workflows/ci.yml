name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false # datasheet PDFs are not needed to lint or test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev and RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog z3
          python -m pip install -e ".[dev,rtl]" yowasp-yosys==0.71.0.0.post1285

      - name: Install pinned verible
        run: make tools

      - name: Lint and format check
        run: make check

      - name: Tests (Python + C host tests)
        run: make test

      - name: RTL simulation (cocotb + Icarus)
        run: make sim SIM=icarus

      - name: Formal proofs (SymbiYosys via YoWASP, z3)
        run: >-
          make formal SBY="yowasp-sby --yosys yowasp-yosys --smtbmc yowasp-yosys-smtbmc
          --witness yowasp-yosys-witness"

      # Prints SKIP until Phase 3 adds a KiCad project; fails if it exists without kicad-cli.
      - name: Hardware checks
        run: make hw-check
