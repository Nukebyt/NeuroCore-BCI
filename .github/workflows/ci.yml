name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false # datasheet PDFs are not needed to lint or test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev and RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog z3
          python -m pip install -e ".[dev,rtl]" yowasp-yosys==0.71.0.0.post1285

      - name: Install pinned verible
        run: make tools

      - name: Lint and format check
        run: make check

      - name: Tests (Python + C host tests)
        run: make test

      - name: RTL simulation (cocotb + Icarus)
        run: make sim SIM=icarus

      - name: Formal proofs (SymbiYosys via YoWASP, z3)
        run: >-
          make formal SBY="yowasp-sby --yosys yowasp-yosys --smtbmc yowasp-yosys-smtbmc
          --witness yowasp-yosys-witness"

      # KiCad 9 from the official KiCad PPA; only kicad-cli is used (ERC, DRC, BOM, Gerbers).
      - name: Install KiCad 9
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version

      - name: Hardware checks (ERC, DRC + schematic parity)
        run: make hw-check
